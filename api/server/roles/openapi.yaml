                  schema:
                    $ref: '#/components/schemas/ID'
                - in: query
                  name: limit
                  schema:
                    default: 20
                    maximum: 100
                    minimum: 1
                    type: integer
                - in: query
                  name: offset
                  schema:
                    default: 0
                    maximum: 2147483647
                    minimum: 0
                    type: integer
                - description: Case-insensitive literal substring of name; % and _ have no wildcard meaning.
                  in: query
                  name: search
                  schema:
                    type: string
                - description: ID is the tie-breaker in the same direction. Default created_at DESC, id DESC.
                  in: query
                  name: sort
                  schema:
                    default: created_at
                    enum:
                        - name
                        - created_at
                        - updated_at
                    type: string
                - in: query
                  name: direction
                  schema:
                    default: desc
                    enum:
                        - asc
                        - desc
                    type: string
