components:
    schemas:
        AssignmentPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/RoleAssignment'
                    type: array
                limit:
                    type: integer
                offset:
                    type: integer
                total:
                    format: int64
                    type: integer
            required:
                - items
                - total
                - limit
                - offset
            type: object
        CreateRole:
            additionalProperties: false
            properties:
                name:
                    maxLength: 200
                    minLength: 1
                    pattern: \S
                    type: string
                permission_codes:
                    items:
                        $ref: '#/components/schemas/PermissionCode'
                    minItems: 1
                    type: array
                    uniqueItems: true
                scope:
                    $ref: '#/components/schemas/Scope'
            required:
                - name
                - scope
                - permission_codes
            type: object
        CreateTemplate:
            additionalProperties: false
            properties:
                name:
                    maxLength: 200
                    minLength: 1
                    pattern: \S
                    type: string
                permission_codes:
                    items:
                        $ref: '#/components/schemas/PermissionCode'
                    minItems: 1
                    type: array
                    uniqueItems: true
                system_id:
                    $ref: '#/components/schemas/ID'
                target_scope_type:
                    $ref: '#/components/schemas/ScopeType'
            required:
                - name
                - system_id
                - target_scope_type
                - permission_codes
            type: object
        Error:
            properties:
                code:
                    description: '400: invalid_input, unknown_permission_code, permission_scope_mismatch, empty_permissions. 404: not_found. 409: version_conflict. 500: internal_error. Authentication: unauthorized (401), unavailable (503).'
                    type: string
                details:
                    items:
                        $ref: '#/components/schemas/ErrorDetail'
                    type: array
                message:
                    type: string
            required:
                - code
                - message
            type: object
        ErrorDetail:
            properties:
                code:
                    type: string
                field:
                    type: string
                message:
                    type: string
            required:
                - field
                - code
                - message
            type: object
        ID:
            maximum: 2147483647
            minimum: 1
            type: integer
        Permission:
            additionalProperties: false
            properties:
                code:
                    $ref: '#/components/schemas/PermissionCode'
                description:
                    type: string
                scope_type:
                    $ref: '#/components/schemas/ScopeType'
                title:
                    type: string
            required:
                - code
                - scope_type
                - title
                - description
            type: object
        PermissionCode:
            minLength: 1
            type: string
        Role:
            additionalProperties: false
            properties:
                created_at:
                    format: date-time
                    type: string
                created_by:
                    $ref: '#/components/schemas/ID'
                id:
                    $ref: '#/components/schemas/ID'
                name:
                    minLength: 1
                    type: string
                permissions:
                    items:
                        $ref: '#/components/schemas/Permission'
                    type: array
                scope:
                    $ref: '#/components/schemas/Scope'
                updated_at:
                    format: date-time
                    type: string
                version:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - id
                - name
                - permissions
                - version
                - created_by
                - created_at
                - updated_at
                - scope
            type: object
        RoleAssignment:
            additionalProperties: false
            properties:
                assigned_at:
                    format: date-time
                    type: string
                assigned_by:
                    $ref: '#/components/schemas/ID'
                role_id:
                    $ref: '#/components/schemas/ID'
                user_id:
                    $ref: '#/components/schemas/ID'
            required:
                - role_id
                - user_id
                - assigned_by
                - assigned_at
            type: object
        RolePage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Role'
                    type: array
                limit:
                    type: integer
                offset:
                    type: integer
                total:
                    format: int64
                    type: integer
            required:
                - items
                - total
                - limit
                - offset
            type: object
        RoleTemplate:
            additionalProperties: false
            properties:
                created_at:
                    format: date-time
                    type: string
                created_by:
                    $ref: '#/components/schemas/ID'
                id:
                    $ref: '#/components/schemas/ID'
                name:
                    minLength: 1
                    type: string
                permissions:
                    items:
                        $ref: '#/components/schemas/Permission'
                    type: array
                system_id:
                    $ref: '#/components/schemas/ID'
                target_scope_type:
                    $ref: '#/components/schemas/ScopeType'
                updated_at:
                    format: date-time
                    type: string
                version:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - id
                - name
                - permissions
                - version
                - created_by
                - created_at
                - updated_at
                - system_id
                - target_scope_type
            type: object
        Scope:
            additionalProperties: false
            properties:
                id:
                    $ref: '#/components/schemas/ID'
                type:
                    $ref: '#/components/schemas/ScopeType'
            required:
                - type
                - id
            type: object
        ScopeType:
            enum:
                - system
                - workspace
                - project
            type: string
        TemplatePage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/RoleTemplate'
                    type: array
                limit:
                    type: integer
                offset:
                    type: integer
                total:
                    format: int64
                    type: integer
            required:
                - items
                - total
                - limit
                - offset
            type: object
        UpdateRole:
            additionalProperties: false
            properties:
                expected_version:
                    format: int64
                    minimum: 1
                    type: integer
                name:
                    maxLength: 200
                    minLength: 1
                    pattern: \S
                    type: string
                permission_codes:
                    items:
                        $ref: '#/components/schemas/PermissionCode'
                    minItems: 1
                    type: array
                    uniqueItems: true
            required:
                - name
                - permission_codes
                - expected_version
            type: object
        UpdateRoleTemplate:
            additionalProperties: false
            properties:
                expected_version:
                    format: int64
                    minimum: 1
                    type: integer
                name:
                    maxLength: 200
                    minLength: 1
                    pattern: \S
                    type: string
                permission_codes:
                    items:
                        $ref: '#/components/schemas/PermissionCode'
                    minItems: 1
                    type: array
                    uniqueItems: true
            required:
                - name
                - permission_codes
                - expected_version
            type: object
        UserRoleAssignment:
            properties:
                assigned_at:
                    format: date-time
                    type: string
                assigned_by:
                    $ref: '#/components/schemas/ID'
                role_id:
                    $ref: '#/components/schemas/ID'
                role_name:
                    type: string
                scope:
                    $ref: '#/components/schemas/Scope'
                user_id:
                    $ref: '#/components/schemas/ID'
            required:
                - role_id
                - user_id
                - role_name
                - scope
                - assigned_by
                - assigned_at
            type: object
        UserRoleAssignmentPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/UserRoleAssignment'
                    type: array
                limit:
                    type: integer
                offset:
                    type: integer
                total:
                    format: int64
                    type: integer
            required:
                - items
                - total
                - limit
                - offset
            type: object
