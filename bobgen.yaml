# Bob генерирует Go-код для SQL-запросов с учётом схемы PostgreSQL.
# Перед make generate примените миграции. Каталоги psql.queries должны лежать в internal/generated/bob.
# https://bob.stephenafamo.com/docs/code-generation/queries/
no_tests: true
type_system: database/sql
plugins_preset: none
types:
  pq.StringArray:
    alias_of: "[]string"
  int32:
    alias_of: int
psql:
  driver: github.com/jackc/pgx/v5/stdlib
  queries:
    - internal/generated/bob/role
    - internal/generated/bob/roletemplate
    - internal/generated/bob/roleassignment
