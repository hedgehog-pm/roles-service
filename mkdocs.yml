site_name: roles-service
site_description: Роли, шаблоны и назначения — интеграция фронтенда

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Включить тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Включить светлую тему
  features:
    - content.code.copy
    - search.highlight

plugins:
  - search:
      lang: [ru, en]

hooks:
  - scripts/docs.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn

nav:
  - О сервисе: index.md
  - Быстрый старт: quick-start.md
  - Интеграция фронтенда: guides/frontend.md
  - Ограничения: limitations.md
  - Для backend:
      - Устройство сервиса: role-module.md
      - Проверка архитектуры: architecture-review.md
